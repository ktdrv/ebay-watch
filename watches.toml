# eBay watches. Re-read on every poll, so `task deploy -- ebay-watch` is all
# an edit needs. Each poll is one API call per watch, and the default Browse
# API quota is 5,000 calls a day: watches x 1440 / interval_minutes must stay
# under it. At 1 minute that is 3 watches (4,320 calls); a 4th needs
# interval_minutes = 2 or a quota raise via eBay's Application Growth Check.
# Past the quota, every poll fails until midnight Pacific.

interval_minutes = 1
# Shipping is quoted to this ZIP. Without it eBay omits calculated shipping.
zip = "10001"

# A new listing alerts when its delivered price (item + cheapest shipping) is
# max_z or more spreads under the LOWER of
#   - the median of listings posted in the last history_days, and
#   - where the price trend over those days puts today's price.
# In a falling market that is the trend, so a listing just riding the slope
# down stays quiet; in a rising one it is the median. The spread is the
# scatter around the trend line, so a steep trend doesn't widen it.
#
#   name          shown in alerts. Price history is keyed by it, so rename the
#                 watch when you change its query, or the old history skews it.
#   query         eBay keyword search. It is loose: "rx 6800" in the graphics
#                 card category also returns RTX 5080s and RX 9070s.
#   match         regex the title must contain (case-insensitive), so only the
#                 model you mean reaches the statistics. Use a single-quoted
#                 TOML string so backslashes stay literal.
#   max_z         default -2. The spread is how far listings below the going
#                 rate typically sit, scaled like a standard deviation (the
#                 overpriced side is ignored, or lingering imports would widen
#                 it). For the RX 6700 XT on 2026-10-06, -2 meant $278 against
#                 a $358 going rate and a 30-day cheapest of $315; -1.5 meant
#                 $298. The dashboard draws the bar, so tune against that. For
#                 a watch's first history_days its history is seeded from
#                 listings still up, which lack the cheap ones that sold fast.
#   history_days  default 30. The window for both the median and the trend.
#                 These cards list about once a day, so a shorter window
#                 leaves too few listings to fit a trend.
#   min_listings, min_days
#                 default 15 and 7. No alerts until the window holds this many
#                 listings across this many separate days. A new watch seeds
#                 its history from what is already listed, so this is often
#                 met on the first poll.
#   min_price     ignore anything with an item price (before shipping) under
#                 this. Drops "box only", parts and
#                 accessory listings, which would otherwise look like the best
#                 deals of all.
#   exclude       ignore titles containing any of these (case-insensitive)
#   min_seller_feedback, min_seller_percent
#                 ignore sellers below this feedback count / positive %.
#                 Cuts scams, at the cost of the occasional real deal from a
#                 private seller with a fresh account.
#   condition_ids e.g. [1000] new, [3000] used, [1000, 1500, 2500, 3000] new
#                 through used. Full list: https://developer.ebay.com/api-docs/sell/static/metadata/condition-id-values.html
#   category_ids  restrict to eBay categories (the number in a category URL)
#   buying_options default ["FIXED_PRICE"], which includes Best Offer
#                 listings. Adding "AUCTION" compares current bids, which are
#                 near-zero on fresh auctions and will alert constantly.
#
# Search results never price calculated shipping, so each new listing that
# uses it costs one extra API call to quote it to the ZIP. Listings eBay still
# can't price (pickup only, freight) and multi-variation listings are ignored. The first poll of a new watch records what is already
# listed (up to 1,000 listings, a few extra API calls once) and alerts on
# nothing; you get one "Watching ..." push saying whether alerts are on yet.

# One watch per GPU model: a listing is compared against its own model's
# prices, so mixing a 6700 XT into the 6800 XT history would make every
# 6700 XT look like a deal. All three are restricted to eBay's Graphics/Video
# Cards category (27386), which keeps out whole PCs and laptops. min_price
# drops coolers, backplates and parts listings, which also escape the exclude
# list surprisingly often.

[[watch]]
name = "RX 6700 XT"
query = "rx 6700 xt"
# Not the 6750 XT or the non-XT 6700
match = '6700\s*-?xt'
category_ids = [27386]
max_z = -2.0
min_seller_feedback = 10
min_seller_percent = 97
min_price = 100
exclude = ["for parts", "parts only", "not working", "broken", "as is", "as-is", "no display", "artifact", "untested", "read desc", "no ray tracing", "box only", "cooler", "heatsink", "backplate", "water block", "waterblock", "shroud", "bracket"]

[[watch]]
name = "RX 6800"
query = "rx 6800"
# The query also returns 6800 XTs ("RX 6800 XT", "RX6800XT"), which belong to the next watch.
# Not the Radeon Pro W6800 workstation card either.
match = '(?<!w)6800(?!\s*-?xt)'
category_ids = [27386]
max_z = -2.0
min_seller_feedback = 10
min_seller_percent = 97
min_price = 140
exclude = ["for parts", "parts only", "not working", "broken", "as is", "as-is", "no display", "artifact", "untested", "read desc", "no ray tracing", "box only", "cooler", "heatsink", "backplate", "water block", "waterblock", "shroud", "bracket"]

[[watch]]
name = "RX 6800 XT"
query = "rx 6800 xt"
match = '(?<!w)6800\s*-?xt'
category_ids = [27386]
max_z = -2.0
min_seller_feedback = 10
min_seller_percent = 97
min_price = 170
exclude = ["for parts", "parts only", "not working", "broken", "as is", "as-is", "no display", "artifact", "untested", "read desc", "no ray tracing", "box only", "cooler", "heatsink", "backplate", "water block", "waterblock", "shroud", "bracket"]
